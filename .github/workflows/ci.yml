name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel older runs of the same ref when new commits land — only the
# tip needs to pass for the PR / branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # gofmt expects LF; Windows checks out CRLF by default. Skip on
      # Windows — Linux/macOS coverage is enough for format consistency.
      - name: gofmt
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1 -timeout=120s

  cross-build:
    name: cross-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/amd64
            goos: darwin
            goarch: amd64
          - target: darwin/arm64
            goos: darwin
            goarch: arm64
          - target: windows/amd64
            goos: windows
            goarch: amd64
          - target: linux/arm64
            goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: build ${{ matrix.target }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./cmd/pe
