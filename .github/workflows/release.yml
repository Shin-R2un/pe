name: release

on:
  push:
    tags:
      - 'v*'
  # Manual re-runs against an existing tag — useful when a flaky token
  # or proxy lag broke the previous run and we don't want to mint a
  # fresh tag. Trigger via:  gh workflow run release --ref vX.Y.Z
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SCOOP_TOKEN is a fine-grained PAT with Contents:write on
          # Shin-R2un/scoop-bucket. Used by goreleaser's `scoops` block
          # to publish the pe manifest after each release.
          SCOOP_TOKEN: ${{ secrets.SCOOP_TOKEN }}
